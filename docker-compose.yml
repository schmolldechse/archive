services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DATABASE:-archive}"
      POSTGRES_USER: "${POSTGRES_USER:-archive}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "5432:5432"
    volumes:
      - archive-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${OBJECT_STORAGE_ACCESS_KEY:?Set OBJECT_STORAGE_ACCESS_KEY in .env}"
      MINIO_ROOT_PASSWORD: "${OBJECT_STORAGE_SECRET_KEY:?Set OBJECT_STORAGE_SECRET_KEY in .env}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - archive-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    environment:
      OBJECT_STORAGE_ACCESS_KEY: "${OBJECT_STORAGE_ACCESS_KEY:?Set OBJECT_STORAGE_ACCESS_KEY in .env}"
      OBJECT_STORAGE_SECRET_KEY: "${OBJECT_STORAGE_SECRET_KEY:?Set OBJECT_STORAGE_SECRET_KEY in .env}"
      OBJECT_STORAGE_BUCKET: "${OBJECT_STORAGE_BUCKET:-snapshots}"
    command: >-
      until mc alias set local http://minio:9000 "$$OBJECT_STORAGE_ACCESS_KEY" "$$OBJECT_STORAGE_SECRET_KEY";
      do sleep 1; done;
      mc mb --ignore-existing "local/$$OBJECT_STORAGE_BUCKET"

  api:
    build:
      context: ./backend
      dockerfile: Archive.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: http://+:8080
      PublicBaseUrl: "${ARCHIVE_PUBLIC_BASE_URL:-http://localhost:5200}"
      ConnectionStrings__ArchiveDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DATABASE:-archive};Username=${POSTGRES_USER:-archive};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      ObjectStorage__ServiceUrl: "${OBJECT_STORAGE_INTERNAL_SERVICE_URL:-http://minio:9000}"
      ObjectStorage__AccessKey: "${OBJECT_STORAGE_ACCESS_KEY:?Set OBJECT_STORAGE_ACCESS_KEY in .env}"
      ObjectStorage__SecretKey: "${OBJECT_STORAGE_SECRET_KEY:?Set OBJECT_STORAGE_SECRET_KEY in .env}"
      ObjectStorage__Bucket: "${OBJECT_STORAGE_BUCKET:-snapshots}"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "dotnet", "Archive.Api.dll", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5200:8080"

  worker:
    init: true
    shm_size: "1gb"
    build:
      context: ./backend
      dockerfile: Archive.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: "${DOTNET_ENVIRONMENT:-Development}"
      Database__Initialize: "false"
      Archive__Browser__Headless: "${ARCHIVE_BROWSER_HEADLESS:-false}"
      Archive__Browser__UserAgent: "${ARCHIVE_BROWSER_USER_AGENT:-ArchiveBot/1.0}"
      Archive__Browser__ChallengeTimeoutSeconds: "${ARCHIVE_CHALLENGE_TIMEOUT_SECONDS:-45}"
      Archive__Browser__ChallengeReloadAttempts: "${ARCHIVE_CHALLENGE_RELOAD_ATTEMPTS:-1}"
      Archive__WebBotAuth__Enabled: "${ARCHIVE_WEB_BOT_AUTH_ENABLED:-false}"
      Archive__WebBotAuth__SignatureAgent: "${ARCHIVE_WEB_BOT_AUTH_SIGNATURE_AGENT:-https://archive.voldechse.wtf}"
      Archive__WebBotAuth__PrivateKeyPath: "${ARCHIVE_WEB_BOT_AUTH_PRIVATE_KEY_PATH:-/run/secrets/web-bot-auth-private-key.pem}"
      Archive__WebBotAuth__SignatureLifetimeSeconds: "${ARCHIVE_WEB_BOT_AUTH_SIGNATURE_LIFETIME_SECONDS:-60}"
      Archive__CrawlPolicy__Enabled: "${ARCHIVE_CRAWL_POLICY_ENABLED:-true}"
      Archive__CrawlPolicy__UserAgentToken: "${ARCHIVE_CRAWL_USER_AGENT_TOKEN:-VoldechseArchiveBot}"
      Archive__CrawlPolicy__MinimumHostDelaySeconds: "${ARCHIVE_MINIMUM_HOST_DELAY_SECONDS:-2}"
      ConnectionStrings__ArchiveDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DATABASE:-archive};Username=${POSTGRES_USER:-archive};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      ObjectStorage__ServiceUrl: "${OBJECT_STORAGE_INTERNAL_SERVICE_URL:-http://minio:9000}"
      ObjectStorage__AccessKey: "${OBJECT_STORAGE_ACCESS_KEY:?Set OBJECT_STORAGE_ACCESS_KEY in .env}"
      ObjectStorage__SecretKey: "${OBJECT_STORAGE_SECRET_KEY:?Set OBJECT_STORAGE_SECRET_KEY in .env}"
      ObjectStorage__Bucket: "${OBJECT_STORAGE_BUCKET:-snapshots}"
    volumes:
      - ${ARCHIVE_WEB_BOT_AUTH_KEY_DIRECTORY:-./.secrets}:/run/secrets:ro
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-http://localhost:5200}"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-http://localhost:5200}"
      INTERNAL_API_BASE_URL: http://api:8080
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  archive-postgres:
  archive-minio:
