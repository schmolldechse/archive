services:
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL is required}
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      ORIGIN: ${ORIGIN:?ORIGIN is required}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL is required}
      INTERNAL_API_BASE_URL: http://api:8080
    expose:
      - "3000"
    networks:
      - archive
    healthcheck:
      test: [CMD, /usr/local/bin/bun, -e, "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  archive:
    name: archive
    external: true
