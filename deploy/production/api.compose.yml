services:
  api:
    build:
      context: ../../backend
      dockerfile: Archive.Api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      PublicBaseUrl: ${ARCHIVE_PUBLIC_BASE_URL:?ARCHIVE_PUBLIC_BASE_URL is required}
      SnapshotContent__PublicOrigin: ${SNAPSHOT_PUBLIC_ORIGIN:?SNAPSHOT_PUBLIC_ORIGIN is required}
      SnapshotContent__PrivateAccessTokenLifetimeMinutes: ${SNAPSHOT_PRIVATE_ACCESS_TOKEN_LIFETIME_MINUTES:-60}
      Authentication__PublicApiOrigin: ${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL is required}
      Authentication__FrontendOrigin: ${ORIGIN:?ORIGIN is required}
      Authentication__SessionCookieDomain: ${AUTHENTICATION_SESSION_COOKIE_DOMAIN:-}
      Authentication__Google__ClientId: ${AUTHENTICATION_GOOGLE_CLIENT_ID:?AUTHENTICATION_GOOGLE_CLIENT_ID is required}
      Authentication__Google__ClientSecret: ${AUTHENTICATION_GOOGLE_CLIENT_SECRET:?AUTHENTICATION_GOOGLE_CLIENT_SECRET is required}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB is required};Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ObjectStorage__ServiceUrl: http://minio:9000
      ObjectStorage__AccessKey: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      ObjectStorage__SecretKey: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
      ObjectStorage__Bucket: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
      Processing__TerminalRetentionSeconds: ${PROCESSING_TERMINAL_RETENTION_SECONDS:-60}
      Processing__CleanupIntervalSeconds: ${PROCESSING_CLEANUP_INTERVAL_SECONDS:-30}
      Processing__CleanupBatchSize: ${PROCESSING_CLEANUP_BATCH_SIZE:-100}
    expose:
      - "8080"
    volumes:
      - api-key-ring:/app/key-ring
    networks:
      - archive
    healthcheck:
      test: [CMD, dotnet, Archive.Api.dll, --healthcheck]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ../../backend
      dockerfile: Archive.Worker/Dockerfile
    restart: unless-stopped
    init: true
    shm_size: 1gb
    environment:
      DOTNET_ENVIRONMENT: Production
      Database__Initialize: "false"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB is required};Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ObjectStorage__ServiceUrl: http://minio:9000
      ObjectStorage__AccessKey: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      ObjectStorage__SecretKey: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
      ObjectStorage__Bucket: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
      Processing__TerminalRetentionSeconds: ${PROCESSING_TERMINAL_RETENTION_SECONDS:-60}
      Archive__Browser__Headless: ${ARCHIVE_BROWSER_HEADLESS:-true}
      Archive__Browser__UserAgent: ${ARCHIVE_BROWSER_USER_AGENT:-ArchiveBot/1.0}
      Archive__Browser__MaxLinkedPages: ${ARCHIVE_BROWSER_MAX_LINKED_PAGES:-100}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - archive

volumes:
  api-key-ring:

networks:
  archive:
    name: archive
    external: true
