services:
  minio:
    build:
      context: ./minio
      dockerfile: Dockerfile
      target: server
    restart: unless-stopped
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
    volumes:
      - minio-data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9000/minio/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio-init:
    build:
      context: ./minio
      dockerfile: Dockerfile
      target: client
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: [/bin/sh, -ec]
    environment:
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
    command:
      - >-
        mc alias set local http://minio:9000 "$$OBJECT_STORAGE_ACCESS_KEY" "$$OBJECT_STORAGE_SECRET_KEY";
        mc mb --ignore-existing "local/$$OBJECT_STORAGE_BUCKET"

volumes:
  minio-data:
