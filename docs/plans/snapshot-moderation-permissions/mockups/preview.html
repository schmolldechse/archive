<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Responsive design previews · archive</title>
    <link rel="stylesheet" href="mockups.css" />
    <script src="mockups.js" defer></script>
  </head>
  <body>
    <!-- Verification harness only. This file does not represent a proposed frontend route. -->
    <div class="preview-controls">
      <div>
        <label for="preview-route">Page</label
        ><select id="preview-route">
          <option value="submissions.html">My submissions</option>
          <option value="snapshot-review.html">Snapshot review</option>
          <option value="user-access.html">User access</option>
        </select>
      </div>
      <div>
        <label for="preview-width">Viewport width</label
        ><select id="preview-width">
          <option value="1440">1440 px · Desktop</option>
          <option value="768">768 px · Tablet</option>
          <option value="390" selected>390 px · Mobile</option>
          <option value="320">320 px · Narrow mobile</option>
        </select>
      </div>
      <div>
        <label for="preview-theme">Theme</label
        ><select id="preview-theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
      <div>
        <label for="preview-scale">Content scale</label
        ><select id="preview-scale">
          <option value="1">100%</option>
          <option value="2">200%</option>
        </select>
      </div>
      <p class="hint">
        Design previews only. Each page reflows inside a fixed-width frame.
      </p>
    </div>
    <div class="preview-stage">
      <iframe
        id="preview-frame"
        title="My submissions at 390 pixels"
        src="submissions.html"
      ></iframe>
    </div>
  </body>
</html>
