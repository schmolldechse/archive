<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Raster fallbacks cover older browsers; the SVG adapts to the browser's color scheme. -->
		<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
		<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#2e52c7" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="application-name" content="Archive" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Archive" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0b1113" media="(prefers-color-scheme: dark)" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			(() => {
				let theme = "light";

				try {
					const savedTheme = window.localStorage.getItem("archiv-theme");
					theme =
						savedTheme === "light" || savedTheme === "dark"
							? savedTheme
							: window.matchMedia("(prefers-color-scheme: dark)").matches
								? "dark"
								: "light";
				} catch {
					theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
				}

				document.documentElement.dataset.theme = theme;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
